[Command]
Name=Search All Tabs
Command="
    copyq:
    var CopyQCore = (function () {
      var modules = {};
      var api = {};
      modules.regex = (function () {
        var module = { exports: {} };
        function require(id) { switch (id) {  default: throw new Error('UNDECLARED_CORE_IMPORT'); } }
    \"use strict\";


    function validateRegex(text) { try { return { ok: true, value: new RegExp(text, 'i') }; } catch (e) { return { ok: false, reason: 'REGEX_INVALID' }; } }

    module.exports = { validateRegex: validateRegex };


        return module.exports;
      }());
      for (var key in modules.regex) if (Object.prototype.hasOwnProperty.call(modules.regex, key)) api[key] = modules.regex[key];
      return api;
    }());
    var query = dialog('Search'); if (!query) abort(); var checked = CopyQCore.validateRegex(query); if (!checked.ok) { notification('.id', 'regex', '.message', checked.reason); abort(); }
    var names = tab(); try { removeTab('Search'); } catch (e) {} tab('Search'); for (var t = 0; t < names.length; t += 1) { if (names[t] === 'Search') continue; tab(names[t]); for (var i = 0; i < size(); i += 1) { var item = getitem(i); if (checked.value.test(str(item[mimeText]))) { tab('Search'); insert(0, item); tab(names[t]); } } } tab('Search');"
